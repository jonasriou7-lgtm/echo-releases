name: Build Echo.exe

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish Echo.exe"
        required: true
        default: "true"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify launcher source patch
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $src = Get-Content launcher\EchoLauncher.cs -Raw

          if ($src -notmatch 'LauncherVersion\s*=\s*"1\.0\.2"') {
            throw "LauncherVersion 1.0.2 absent."
          }
          if ($src -notmatch 'releases/download/echo-stable/echo-update\.json') {
            throw "Canal echo-stable absent."
          }
          if ($src -notmatch 'SecurityProtocol\s*=\s*\(SecurityProtocolType\)3072') {
            throw "TLS 1.2 absent."
          }
          if ($src -notmatch 'DownloadData\(url\)') {
            throw "Lecture robuste du manifest absente."
          }

      - name: Verify stable manifest over HTTPS
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          $url = "https://github.com/jonasriou7-lgtm/echo-releases/releases/download/echo-stable/echo-update.json"
          $tmp = Join-Path $env:TEMP "echo-stable-manifest.json"

          Invoke-WebRequest `
            -UseBasicParsing `
            -Uri ($url + "?t=" + [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()) `
            -OutFile $tmp `
            -Headers @{
              "Cache-Control" = "no-cache"
              "User-Agent" = "Echo-GitHub-Action-Test"
            }

          $manifest = Get-Content $tmp -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($manifest.product -ne "echo-desktop") {
            throw "Produit manifest incorrect."
          }
          if (-not $manifest.version) {
            throw "Version manifest absente."
          }

          Write-Host "[OK] Canal stable : $($manifest.version)"

      - name: Compile Echo.exe
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path build | Out-Null

          $cscCandidates = @(
            "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe",
            "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          )
          $csc = $cscCandidates |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $csc) {
            throw "csc.exe introuvable."
          }

          & $csc `
            /nologo `
            /optimize+ `
            /target:winexe `
            /platform:anycpu `
            /out:build\Echo.exe `
            /win32manifest:launcher\app.manifest `
            /reference:System.dll `
            /reference:System.Core.dll `
            /reference:System.Drawing.dll `
            /reference:System.Windows.Forms.dll `
            /reference:System.Web.Extensions.dll `
            /reference:System.IO.Compression.dll `
            /reference:System.IO.Compression.FileSystem.dll `
            launcher\EchoLauncher.cs

          if ($LASTEXITCODE -ne 0) {
            throw "Compilation Echo.exe échouée."
          }

      - name: Run binary self-test
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $exe = (Resolve-Path ".\build\Echo.exe").Path
          $result = Join-Path $env:TEMP "echo-self-test.txt"
          Remove-Item $result -Force -ErrorAction SilentlyContinue

          $proc = Start-Process `
            -FilePath $exe `
            -ArgumentList @("--self-test", "`"$result`"") `
            -Wait `
            -PassThru

          if ($proc.ExitCode -ne 0) {
            throw "Echo.exe self-test returned $($proc.ExitCode)"
          }

          if (-not (Test-Path $result)) {
            throw "Résultat self-test absent."
          }

          $text = (Get-Content $result -Raw).Trim()
          if ($text -notlike "SELFTEST_OK*") {
            throw "Self-test failed: $text"
          }

          Write-Host "[OK] $text"

      - name: Authenticode signing
        shell: powershell
        timeout-minutes: 2
        env:
          ECHO_SIGN_PFX_HEX: ${{ secrets.ECHO_SIGN_PFX_HEX }}
          ECHO_SIGN_PFX_PASSWORD: ${{ secrets.ECHO_SIGN_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "[SIGN 1/5] Reconstruction PFX..."

          if ([string]::IsNullOrWhiteSpace($env:ECHO_SIGN_PFX_HEX)) {
            throw "Secret ECHO_SIGN_PFX_HEX absent."
          }
          if ([string]::IsNullOrWhiteSpace($env:ECHO_SIGN_PFX_PASSWORD)) {
            throw "Secret ECHO_SIGN_PFX_PASSWORD absent."
          }

          $hex = ($env:ECHO_SIGN_PFX_HEX.Trim() -replace '\s', '')

          if (($hex.Length % 2) -ne 0) {
            throw "HEX impair."
          }
          if ($hex -notmatch '^[0-9A-Fa-f]+$') {
            throw "HEX invalide."
          }

          $bytes = New-Object byte[] ($hex.Length / 2)
          for ($i = 0; $i -lt $hex.Length; $i += 2) {
            $bytes[$i / 2] = [Convert]::ToByte($hex.Substring($i, 2), 16)
          }

          $pfx = Join-Path $env:TEMP "echo-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, $bytes)

          Write-Host "[SIGN 2/5] Chargement certificat en mémoire..."

          $flags = `
            [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable `
            -bor `
            [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::PersistKeySet

          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2
          $cert.Import(
            $pfx,
            $env:ECHO_SIGN_PFX_PASSWORD,
            $flags
          )

          if (-not $cert.HasPrivateKey) {
            throw "Le certificat chargé n'a pas de clé privée."
          }

          Write-Host "[OK] Certificat : $($cert.Subject)"
          Write-Host "[OK] Thumbprint : $($cert.Thumbprint)"

          Write-Host "[SIGN 3/5] Signature PowerShell native..."

          $signResult = Set-AuthenticodeSignature `
            -FilePath "build\Echo.exe" `
            -Certificate $cert `
            -HashAlgorithm SHA256

          if (-not $signResult.SignerCertificate) {
            throw "Set-AuthenticodeSignature n'a pas ajouté de signature."
          }

          Write-Host "[SIGN 4/5] Vérification de la signature embarquée..."

          $signature = Get-AuthenticodeSignature "build\Echo.exe"

          if (-not $signature.SignerCertificate) {
            throw "Echo.exe est toujours non signé."
          }

          if ($signature.SignerCertificate.Thumbprint -ne $cert.Thumbprint) {
            throw "Le thumbprint de la signature ne correspond pas au certificat."
          }

          if ($signature.Status -eq "NotSigned") {
            throw "Status Authenticode = NotSigned."
          }

          Write-Host "[OK] Signature embarquée."
          Write-Host "[OK] Status runner : $($signature.Status)"
          Write-Host "[OK] Signer : $($signature.SignerCertificate.Subject)"

          Write-Host "[SIGN 5/5] Terminé."

          # On a self-signed development certificate, the GitHub runner does not
          # need to trust the issuer. The final PC already trusts this certificate
          # and will perform the final Status=Valid check after download.

      - name: Generate hashes
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $hash = (Get-FileHash build\Echo.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Echo.exe" |
            Set-Content build\Echo.exe.sha256.txt -Encoding ascii

          @{
            launcher_version = "1.0.2"
            update_channel = "echo-stable"
            signing = "powershell-authenticode-self-signed-dev"
            sha256 = $hash
            built_at = (Get-Date).ToUniversalTime().ToString("o")
          } |
            ConvertTo-Json |
            Set-Content build\echo-launcher-info.json -Encoding UTF8

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Echo-Universal-Launcher-1.0.2
          path: |
            build/Echo.exe
            build/Echo.exe.sha256.txt
            build/echo-launcher-info.json

      - name: Publish launcher release
        if: ${{ inputs.publish == 'true' }}
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          $tag = "echo-launcher-v1.0.2"

          $old = $ErrorActionPreference
          $ErrorActionPreference = "Continue"

          & gh release view $tag --repo $repo --json tagName *> $null
          $exists = ($LASTEXITCODE -eq 0)

          $ErrorActionPreference = $old

          if (-not $exists) {
            & gh release create $tag `
              --repo $repo `
              --title "Echo Universal Launcher 1.0.2" `
              --notes "Echo launcher 1.0.2 - PowerShell Authenticode signing."

            if ($LASTEXITCODE -ne 0) {
              throw "Création release échouée."
            }
          }

          & gh release upload $tag `
            build\Echo.exe `
            build\Echo.exe.sha256.txt `
            build\echo-launcher-info.json `
            --repo $repo `
            --clobber

          if ($LASTEXITCODE -ne 0) {
            throw "Upload release échoué."
          }
