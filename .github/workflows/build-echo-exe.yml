name: Build Echo.exe

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish Echo.exe"
        required: true
        default: "true"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify launcher source patch
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $src = Get-Content launcher\EchoLauncher.cs -Raw

          if ($src -notmatch 'LauncherVersion\s*=\s*"1\.0\.2"') {
            throw "LauncherVersion 1.0.2 absent."
          }
          if ($src -notmatch 'releases/download/echo-stable/echo-update\.json') {
            throw "Canal echo-stable absent."
          }
          if ($src -notmatch 'SecurityProtocol\s*=\s*\(SecurityProtocolType\)3072') {
            throw "TLS 1.2 absent."
          }
          if ($src -notmatch 'DownloadData\(url\)') {
            throw "Lecture binaire robuste du manifest absente."
          }

          Write-Host "[OK] Source launcher 1.0.2 validée."

      - name: Verify stable manifest over HTTPS
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          $url = "https://github.com/jonasriou7-lgtm/echo-releases/releases/download/echo-stable/echo-update.json"
          $tmp = Join-Path $env:TEMP "echo-stable-manifest.json"
          Remove-Item $tmp -Force -ErrorAction SilentlyContinue

          Invoke-WebRequest `
            -UseBasicParsing `
            -Uri ($url + "?t=" + [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()) `
            -OutFile $tmp `
            -Headers @{
              "Cache-Control" = "no-cache"
              "User-Agent" = "Echo-GitHub-Action-Test"
            }

          if (-not (Test-Path $tmp)) {
            throw "Manifest stable non téléchargé."
          }

          $raw = Get-Content $tmp -Raw -Encoding UTF8
          $manifest = $raw | ConvertFrom-Json

          if ($manifest.product -ne "echo-desktop") {
            throw "Produit manifest incorrect."
          }
          if (-not $manifest.version) {
            throw "Version manifest absente."
          }

          Write-Host "[OK] Canal stable HTTPS/TLS : version $($manifest.version)"

      - name: Compile Echo.exe
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path build | Out-Null

          $cscCandidates = @(
            "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe",
            "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          )
          $csc = $cscCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $csc) { throw "csc.exe introuvable." }

          & $csc `
            /nologo `
            /optimize+ `
            /target:winexe `
            /platform:anycpu `
            /out:build\Echo.exe `
            /win32manifest:launcher\app.manifest `
            /reference:System.dll `
            /reference:System.Core.dll `
            /reference:System.Drawing.dll `
            /reference:System.Windows.Forms.dll `
            /reference:System.Web.Extensions.dll `
            /reference:System.IO.Compression.dll `
            /reference:System.IO.Compression.FileSystem.dll `
            launcher\EchoLauncher.cs

          if ($LASTEXITCODE -ne 0) {
            throw "Compilation Echo.exe échouée."
          }

      - name: Run binary self-test
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $exe = (Resolve-Path ".\build\Echo.exe").Path
          $result = Join-Path $env:TEMP "echo-self-test.txt"
          Remove-Item $result -Force -ErrorAction SilentlyContinue

          $proc = Start-Process `
            -FilePath $exe `
            -ArgumentList @("--self-test", "`"$result`"") `
            -Wait `
            -PassThru

          if ($proc.ExitCode -ne 0) {
            throw "Echo.exe self-test returned $($proc.ExitCode)"
          }

          $text = (Get-Content $result -Raw).Trim()
          if ($text -notlike "SELFTEST_OK*") {
            throw "Self-test failed: $text"
          }

          Write-Host "[OK] $text"

      - name: Optional Authenticode signing
        shell: powershell
        env:
          ECHO_SIGN_PFX_BASE64: ${{ secrets.ECHO_SIGN_PFX_BASE64 }}
          ECHO_SIGN_PFX_PASSWORD: ${{ secrets.ECHO_SIGN_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:ECHO_SIGN_PFX_BASE64)) {
            Write-Warning "Aucun certificat configuré : Echo.exe restera non signé."
            exit 0
          }

          $pfx = Join-Path $env:TEMP "echo-signing.pfx"
          [IO.File]::WriteAllBytes(
            $pfx,
            [Convert]::FromBase64String($env:ECHO_SIGN_PFX_BASE64)
          )

          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $signtool) { throw "signtool.exe introuvable." }

          & $signtool sign /fd SHA256 /f $pfx /p $env:ECHO_SIGN_PFX_PASSWORD `
            /tr http://timestamp.digicert.com /td SHA256 build\Echo.exe

          if ($LASTEXITCODE -ne 0) { throw "Signature échouée." }

      - name: Generate hashes
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $hash = (Get-FileHash build\Echo.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Echo.exe" | Set-Content build\Echo.exe.sha256.txt -Encoding ascii

          @{
            launcher_version = "1.0.2"
            update_channel = "echo-stable"
            manifest_url = "https://github.com/jonasriou7-lgtm/echo-releases/releases/download/echo-stable/echo-update.json"
            sha256 = $hash
            built_at = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json | Set-Content build\echo-launcher-info.json -Encoding UTF8

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Echo-Universal-Launcher-1.0.2
          path: |
            build/Echo.exe
            build/Echo.exe.sha256.txt
            build/echo-launcher-info.json

      - name: Publish launcher release
        if: ${{ inputs.publish == 'true' }}
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          $tag = "echo-launcher-v1.0.2"

          $old = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          & gh release view $tag --repo $repo --json tagName *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = $old

          if (-not $exists) {
            & gh release create $tag `
              --repo $repo `
              --title "Echo Universal Launcher 1.0.2" `
              --notes "TLS 1.2 + stable channel + robust binary manifest decoding."

            if ($LASTEXITCODE -ne 0) {
              throw "Création release launcher échouée."
            }
          }

          & gh release upload $tag `
            build\Echo.exe `
            build\Echo.exe.sha256.txt `
            build\echo-launcher-info.json `
            --repo $repo `
            --clobber

          if ($LASTEXITCODE -ne 0) {
            throw "Upload Echo.exe échoué."
          }

          Write-Host "[OK] Echo.exe 1.0.2 publié."
